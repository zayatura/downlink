[package]
name = "downlink"
description = "Menu-bar companion for the ZSA Voyager: live layout view and per-layer input-source switching"
default-run = "downlink"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
companion-core.workspace = true
input-source.workspace = true
oryx-protocol.workspace = true
oryx-device = { workspace = true, features = ["hid"] }
oryx-layout = { workspace = true, features = ["client"] }
iced = { version = "0.14", features = ["advanced", "canvas", "tokio"] }
futures = "0.3"
dirs = "7"
png = "0.18"
resvg = { version = "0.48", default-features = false }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSAppearance", "NSApplication", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString"] }
tray-icon = "0.26"

[target.'cfg(target_os = "linux")'.dependencies]
# async-io, not the default tokio: ksni's blocking calls would start a tokio runtime inside the
# one iced runs `update` in, and tokio panics on that (spec §5).
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

[dev-dependencies]
tempfile.workspace = true
